<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Art Exhibition Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      min-height: 100vh;
      color: #1c1c1e;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-6">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-50 glass-nav px-5 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <button id="backBtn" onclick="showHomeScreen()" class="hidden p-2 -ml-2 rounded-full hover:bg-black/5 active:scale-95 transition">
        <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <h1 id="appTitle" class="text-xl font-bold tracking-tight text-gray-900">ART EXHIBITION TRACKER</h1>
    </div>
  </header>

  <main class="px-4 py-5 flex-1 max-w-md mx-auto w-full">

    <!-- HOME SCREEN (3 ICONS) -->
    <div id="homeScreen" class="space-y-4">
      
      <!-- CARD 1: SUBMISSION -->
      <div onclick="showSubmissionScreen()" class="glass-card rounded-3xl p-5 flex items-center space-x-4 cursor-pointer active:scale-98 transition transform">
        <div class="w-14 h-14 rounded-2xl bg-blue-500/10 flex items-center justify-center text-blue-600 shrink-0">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </div>
        <div class="flex-1">
          <h2 class="text-base font-bold text-gray-900">ARTWORK SUBMISSION</h2>
          <p class="text-xs font-semibold text-blue-600 mt-0.5">TAP TO VIEW & SUBMIT</p>
        </div>
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </div>

      <!-- CARD 2: RETURN -->
      <div class="glass-card rounded-3xl p-5 flex items-center space-x-4 opacity-90">
        <div class="w-14 h-14 rounded-2xl bg-amber-500/10 flex items-center justify-center text-amber-600 shrink-0">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        </div>
        <div class="flex-1">
          <h2 class="text-base font-bold text-gray-900">ARTWORK RETURN</h2>
          <span class="inline-block mt-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-200">EMPTY; SHOW NOW</span>
        </div>
      </div>

      <!-- CARD 3: STATUS -->
      <div class="glass-card rounded-3xl p-5 flex items-center space-x-4 opacity-90">
        <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 flex items-center justify-center text-emerald-600 shrink-0">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <div class="flex-1">
          <h2 class="text-base font-bold text-gray-900">STATUS</h2>
          <span class="inline-block mt-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200">EMPTY; SHOW NOW</span>
        </div>
      </div>

    </div>

    <!-- SUBMISSION SCREEN -->
    <div id="submissionScreen" class="hidden space-y-4">
      
      <!-- SEARCH BAR -->
      <div class="glass-card rounded-2xl p-3 flex items-center space-x-3">
        <svg class="w-5 h-5 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" id="searchInput" oninput="filterStudents()" placeholder="SEARCH STUDENT BY NAME OR CLASS..." class="w-full text-xs font-bold uppercase bg-transparent text-gray-900 focus:outline-none placeholder-gray-400">
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden text-gray-400 hover:text-gray-600 p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- LOADER -->
      <div id="loader" class="py-12 text-center">
        <div class="inline-block w-8 h-8 border-3 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs font-bold text-gray-500 mt-3">LOADING RECORDS...</p>
      </div>

      <!-- LIST CONTAINER -->
      <div id="studentList" class="space-y-3"></div>

      <!-- NO RESULTS PLACEHOLDER -->
      <div id="noResults" class="hidden py-8 text-center glass-card rounded-2xl">
        <p class="text-xs font-bold text-gray-500">NO STUDENT FOUND MATCHING YOUR SEARCH</p>
      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="mt-auto text-center py-4">
    <p class="text-xs font-bold text-gray-500 tracking-wide">MADE BY DARPAN SUKLA</p>
  </footer>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9MYoRpbaJg7oK3vqkTjfsm616eD9xvUeeE3DxTSzWCF5gCdBOdqfnQQbbwbnycXopvrScE5kg-3R6/pub?gid=0&single=true&output=csv';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby3bBSCXsgrUkGejcOLcZshWKZvoc_YPC5ITpZXMNxs4eR9HFdhY66ETrJjLigJEBcimg/exec';

    let studentsData = [];
    const submittedState = {};

    function showHomeScreen() {
      document.getElementById('homeScreen').classList.remove('hidden');
      document.getElementById('submissionScreen').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
      document.getElementById('appTitle').innerText = 'ART EXHIBITION TRACKER';
    }

    function showSubmissionScreen() {
      document.getElementById('homeScreen').classList.add('hidden');
      document.getElementById('submissionScreen').classList.remove('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      document.getElementById('appTitle').innerText = 'SUBMISSION';
      if (studentsData.length === 0) fetchStudentData();
    }

    function convertDriveUrl(url) {
      if (!url) return '';
      let fileId = '';
      const match1 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      const match2 = url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match1 && match1[1]) fileId = match1[1];
      else if (match2 && match2[1]) fileId = match2[1];
      
      if (fileId) {
        return `https://lh3.googleusercontent.com/d/${fileId}`;
      }
      return url.trim();
    }

    function fetchStudentData() {
      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('studentList').innerHTML = '';
      document.getElementById('noResults').classList.add('hidden');

      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          document.getElementById('loader').classList.add('hidden');
          studentsData = results.data;
          renderStudentCards(studentsData);
        },
        error: function(err) {
          document.getElementById('loader').innerHTML = '<p class="text-xs font-bold text-red-500">ERROR LOADING DATA</p>';
        }
      });
    }

    function filterStudents() {
      const query = document.getElementById('searchInput').value.trim().toUpperCase();
      const clearBtn = document.getElementById('clearSearchBtn');
      
      if (query.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      const filtered = studentsData.filter(student => {
        const name = String(student["Student Name"] || student["STUDENT NAME"] || student["Name"] || "").toUpperCase();
        const studentClass = String(student["Appearing Fine Arts Class"] || student["Class"] || "").toUpperCase();
        return name.includes(query) || studentClass.includes(query);
      });

      renderStudentCards(filtered);
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderStudentCards(studentsData);
    }

    function renderStudentCards(data) {
      const container = document.getElementById('studentList');
      const noResults = document.getElementById('noResults');
      container.innerHTML = '';

      if (data.length === 0) {
        noResults.classList.remove('hidden');
        return;
      }
      noResults.classList.add('hidden');

      data.forEach((student, idx) => {
        const rawName = student["Student Name"] || student["STUDENT NAME"] || student["Name"] || "N/A";
        const rawClass = student["Appearing Fine Arts Class"] || student["Class"] || "N/A";
        const rawPhoto = student["Passport Photo URL"] || student["Photo"] || "";
        
        const name = String(rawName).toUpperCase();
        const studentClass = String(rawClass).toUpperCase();
        const photoUrl = convertDriveUrl(rawPhoto);

        const card = document.createElement('div');
        card.className = "glass-card rounded-2xl p-4 flex flex-col space-y-3";
        
        const isSubmitted = !!submittedState[name];
        
        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-14 h-14 rounded-full bg-gray-200 shrink-0 overflow-hidden relative flex items-center justify-center border-2 border-white shadow-sm">
              ${photoUrl ? `<img src="${photoUrl}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'text-xs font-bold text-gray-500\'>IMG</span>';">` : `<span class="text-xs font-bold text-gray-500">N/A</span>`}
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-sm font-bold text-gray-900 truncate">${name}</h3>
              <p class="text-xs font-semibold text-gray-500">CLASS: ${studentClass}</p>
            </div>
          </div>

          <div class="flex items-center justify-between pt-1 border-t border-gray-100">
            <div class="flex items-center space-x-2">
              <button onclick="updateCanvas('${name}', -1)" class="w-8 h-8 rounded-xl bg-gray-200 text-gray-800 font-bold flex items-center justify-center active:scale-90 transition">-</button>
              <span id="canvas-val-${idx}" class="text-sm font-bold w-6 text-center">2</span>
              <button onclick="updateCanvas('${name}', 1)" class="w-8 h-8 rounded-xl bg-gray-200 text-gray-800 font-bold flex items-center justify-center active:scale-90 transition">+</button>
            </div>
            
            <button id="btn-${idx}" onclick="submitSingleStudent(${idx}, '${encodeURIComponent(name)}', '${encodeURIComponent(studentClass)}', '${encodeURIComponent(rawPhoto)}')" 
                    class="px-4 py-2 text-white font-bold text-xs rounded-xl shadow-md active:scale-95 transition ${isSubmitted ? 'bg-slate-700' : 'bg-blue-600'}">
              ${isSubmitted ? 'RESUBMIT' : 'SUBMIT'}
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateCanvas(name, delta) {
      const idx = studentsData.findIndex(s => {
        const rawName = s["Student Name"] || s["STUDENT NAME"] || s["Name"] || "";
        return String(rawName).toUpperCase() === name;
      });
      if (idx !== -1) {
        const el = document.getElementById(`canvas-val-${idx}`);
        if (el) {
          let val = parseInt(el.innerText) + delta;
          if (val < 0) val = 0;
          el.innerText = val;
        }
      }
    }

    function submitSingleStudent(idx, encodedName, encodedClass, encodedPhoto) {
      const name = decodeURIComponent(encodedName);
      const studentClass = decodeURIComponent(encodedClass);
      const photoLink = decodeURIComponent(encodedPhoto);
      const count = document.getElementById(`canvas-val-${idx}`).innerText;
      const btn = document.getElementById(`btn-${idx}`);

      btn.disabled = true;
      btn.innerText = 'SENDING...';
      btn.className = "px-4 py-2 bg-gray-400 text-white font-bold text-xs rounded-xl";

      const payload = {
        "Student Name": name,
        "Class": studentClass,
        "Total Canvas Submissions": count,
        "Photo Link": photoLink
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        submittedState[name] = true;
        btn.disabled = false;
        btn.innerText = 'RESUBMIT';
        btn.className = "px-4 py-2 bg-slate-700 text-white font-bold text-xs rounded-xl shadow-md active:scale-95 transition";
      }).catch(() => {
        btn.disabled = false;
        btn.innerText = 'RETRY';
        btn.className = "px-4 py-2 bg-red-600 text-white font-bold text-xs rounded-xl";
      });
    }
  </script>
</body>
</html>
